[project]
name = "autosupplyguard"
version = "0.1.0"
description = "Evidence-Driven Cybersecurity Assurance for Multi-Tier Automotive Supply Chains"
authors = [{ name = "Sai Deep" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "zstandard>=0.20",
    "packageurl-python>=0.17",
    "packaging>=24.0",
    "networkx>=3.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.35",
    "pytest>=8.0",
    "pytest-asyncio>=0.23"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
