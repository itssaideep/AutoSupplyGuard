[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosupplyguard"
version = "0.1.0"
description = "Evidence-Driven Cybersecurity Assurance for Multi-Tier Automotive Supply Chains"
authors = [{ name = "Sai Deep" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "zstandard>=0.20",
    "packageurl-python>=0.17",
    "packaging>=24.0",
    "networkx>=3.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "streamlit>=1.35",
    "psutil>=5.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.90",
    "ruff>=0.3",
    "pre-commit>=3.6"
]
binary = [
    "pyelftools>=0.30"
]

[project.scripts]
autosupplyguard-exp1 = "scripts.run_experiment_1:main"
autosupplyguard-exp2 = "scripts.run_experiment_2:main"
autosupplyguard-exp3 = "scripts.run_experiment_3:main"
autosupplyguard-exp4 = "scripts.run_experiment_4:main"
autosupplyguard-b1 = "scripts.run_experiment_b1:main"
autosupplyguard-b2 = "scripts.run_experiment_b2:main"
autosupplyguard-fetch = "scripts.fetch_data:main"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*",
    "ignore:.*unclosed <socket.socket.*:ResourceWarning"
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

